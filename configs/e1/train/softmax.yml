data:
  train:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.e1.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'train'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: True
      batch_size: 64

  train_eval:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.e1.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'train'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 512

  valid:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.e1.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'val'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 512

model:
  module: models.e1.softmax
  name: SoftmaxClassifier
  kwargs:
    in_channels: 1
    image_size: 28
    num_classes: 10

optimizer:
  module: torch.optim
  name: SGD
  kwargs:
    params: model.parameters()
    lr: 0.01
    momentum: 0.9

loss_fn:
  module: flame.loss
  name: Loss
  kwargs:
    loss_fn:
      module: torch.nn
      name: CrossEntropyLoss

engine:
  module: flame.engine
  name: Trainer.factory
  kwargs:
    model: model
    data: data.train
    optimizer: optimizer
    loss_fn: loss_fn
    device: "'cuda'"
    max_epochs: 1000

evaluators:
  train:
    module: flame.engine
    name: Evaluator.factory
    kwargs:
      model: model
      data: data.train_eval
      device: "'cuda'"
    event: Events.EPOCH_COMPLETED
    function: run

  valid:
    module: flame.engine
    name: Evaluator.factory
    kwargs:
      model: model
      data: data.valid
      device: "'cuda'"
    event: Events.EPOCH_COMPLETED
    function: run

metrics:
  module: flame.handlers
  name: Metrics
  kwargs:
    evaluators:
      - evaluators.train
      - evaluators.valid
    metrics:
      loss:
        module: ignite.metrics
        name: Loss
        kwargs:
          loss_fn:
            module: torch.nn
            name: CrossEntropyLoss
      accuracy:
        module: ignite.metrics
        name: Accuracy
      precision:
        module: ignite.metrics
        name: Precision
        kwargs:
          average: True

lr_scheduler:
  module: handlers.schedulers.plateau
  name: SerializableReduceLROnPlateauScheduler
  kwargs:
    optimizer: optimizer
    metric_name: "'loss'"
    mode: "'min'"
    factor: 0.1
    patience: 10
    trainer: engine
  engine: evaluators.valid
  event: Events.EPOCH_COMPLETED

logging:
  progress_bar:
    module: flame.handlers
    name: ProgressBar
    kwargs:
      trainer: engine
      evaluators:
        train: evaluators.train
        valid: evaluators.valid

  tensorboard:
    module: flame.handlers
    name: Tensorboard
    kwargs:
      log_dir: "'logs/e1/train/softmax/'"
      logger_handlers:
        - engine: engine
          event_name: Events.EPOCH_COMPLETED
          log_handler:
            module: ignite.contrib.handlers.tensorboard_logger
            name: OptimizerParamsHandler
            kwargs:
              optimizer: optimizer
        - engine: engine
          event_name: Events.ITERATION_COMPLETED
          log_handler:
            module: ignite.contrib.handlers.tensorboard_logger
            name: OutputHandler
            kwargs:
              tag: "'training'"
              output_transform: "lambda loss: {'loss': loss}"
        - engine: evaluators.train
          event_name: Events.EPOCH_COMPLETED
          log_handler:
            module: ignite.contrib.handlers.tensorboard_logger
            name: OutputHandler
            kwargs:
              tag: "'evaluation/train'"
              metric_names: "'all'"
              global_step_transform: global_step_from_engine(engine, Events.EPOCH_COMPLETED)
        - engine: evaluators.valid
          event_name: Events.EPOCH_COMPLETED
          log_handler:
            module: ignite.contrib.handlers.tensorboard_logger
            name: OutputHandler
            kwargs:
              tag: "'evaluation/valid'"
              metric_names: "'all'"
              global_step_transform: global_step_from_engine(engine, Events.EPOCH_COMPLETED)

early_stopping:
  module: flame.handlers
  name: EarlyStopping
  kwargs:
    patience: 20
    score_name: "'loss'"
    mode: "'min'"
    trainer: engine
    evaluator: evaluators.valid
  event: Events.EPOCH_COMPLETED

checkpoint:
  best:
    module: flame.handlers
    name: BestCheckpoint
    kwargs:
      engine: evaluators.valid
      event: Events.EPOCH_COMPLETED
      modules:
        - "'model'"
      dirname: "'checkpoints/e1/train/softmax/'"
      score_name: "'loss'"
      mode: "'min'"
      n_saved: 1
      global_step_transform: global_step_from_engine(engine, Events.EPOCH_COMPLETED)

  backup:
    module: flame.handlers
    name: BackupCheckpoint
    kwargs:
      engine: engine
      event: Events.EPOCH_COMPLETED
      modules:
        - "'model'"
        - "'engine'"
        - "'optimizer'"
        - "'lr_scheduler'"
        - "'early_stopping'"
        - "'checkpoint.best'"
      dirname: "'checkpoints/e1/train/softmax/'"
      n_saved: 1
      global_step_transform: global_step_from_engine(engine, Events.EPOCH_COMPLETED)

  loader:
    module: flame.handlers
    name: CheckpointLoader
    kwargs:
      path: null

  config_backup:
    module: flame.handlers
    name: ConfigBackup
    kwargs:
      backup_checkpoint: checkpoint.backup

extralibs:
  transforms: torchvision.transforms
  Events:
    module: ignite.engine
    name: Events
  global_step_from_engine:
    module: ignite.handlers
    name: global_step_from_engine
