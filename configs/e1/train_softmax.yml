data:
  train:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'train'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: True
      batch_size: 64

  train_eval:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'train'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 64

  valid:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'val'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 64

model:
  module: models.e1.softmax
  name: SoftmaxClassifier
  kwargs:
    in_channels: 1
    image_size: 28
    num_classes: 10

optimizer:
  module: torch.optim
  name: SGD
  kwargs:
    params: model.parameters()
    lr: 0.01
    momentum: 0.9

loss_fn:
  module: torch.nn
  name: CrossEntropyLoss

trainer:
  module: common.engine.trainer
  name: Trainer
  kwargs:
    data: data.train
    model: model
    optimizer: optimizer
    loss_fn: loss_fn
    device: null
    max_epochs: 10

evaluators:
  train:
    module: common.engine.evaluator
    name: Evaluator
    kwargs:
      data: data.train_eval
      model: model
      device: null

  valid:
    module: common.engine.evaluator
    name: Evaluator
    kwargs:
      data: data.valid
      model: model
      device: null

metrics:
  loss:
    module: common.metrics.loss
    name: Loss
    kwargs:
      loss_fn:
        module: torch.nn
        name: CrossEntropyLoss
  accuracy:
    module: common.metrics.accuracy
    name: Accuracy
    kwargs:
      num_classes: 10
  precision:
    module: common.metrics.precision
    name: Precision
    kwargs:
      num_classes: 10
  recall:
    module: common.metrics.recall
    name: Recall
    kwargs:
      num_classes: 10
  f1_score:
    module: common.metrics.f1_score
    name: F1Score
    kwargs:
      num_classes: 10

logging:
  tensorboard:
    module: common.handlers.logging.tensorboard
    name: TensorBoardLogger
    kwargs:
      log_dir: "'logs/e1/softmax'"
  tqdm:
    module: common.handlers.logging.tqdm_logger
    name: TQDMLogger

extralibs:
  transforms: torchvision.transforms
