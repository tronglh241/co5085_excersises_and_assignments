data:
  test:
    module: torch.utils.data
    name: DataLoader
    kwargs:
      dataset:
        module: datasets.e1.mnist
        name: MNIST
        kwargs:
          root: "'data/'"
          split: "'test'"
          transform: 'transforms.Compose([
            transforms.ToTensor(),
            transforms.Normalize((0.1308,), (0.3082,)),
          ])'
      shuffle: False
      batch_size: 512

model:
  module: models.e1.softmax
  name: SoftmaxClassifier
  kwargs:
    in_channels: 1
    image_size: 28
    num_classes: 10

engine:
  module: flame.engine
  name: Evaluator.factory
  kwargs:
    model: model
    data: data.test
    device: "'cuda'"

metrics:
  module: flame.handlers
  name: Metrics
  kwargs:
    evaluators:
      - engine
    metrics:
      accuracy:
        module: ignite.metrics
        name: Accuracy
      precision:
        module: ignite.metrics
        name: Precision
        kwargs:
          average: True

logging:
  progress_bar:
    module: flame.handlers
    name: ProgressBar
    kwargs:
      evaluators:
        test: engine

  tensorboard:
    module: flame.handlers
    name: Tensorboard
    kwargs:
      log_dir: "'logs/e1/test/softmax/'"
      logger_handlers:
        - engine: engine
          event_name: Events.EPOCH_COMPLETED
          log_handler:
            module: ignite.contrib.handlers.tensorboard_logger
            name: OutputHandler
            kwargs:
              tag: "'evaluation/test'"
              metric_names: "'all'"
              global_step_transform: global_step_from_engine(engine, Events.EPOCH_COMPLETED)

checkpoint:
  loader:
    module: flame.handlers
    name: CheckpointLoader
    kwargs:
      path: "'checkpoints/e1/train/softmax/261005082522/best_model_18_loss=-0.2890.pt'"

extralibs:
  transforms: torchvision.transforms
  Events:
    module: ignite.engine
    name: Events
  global_step_from_engine:
    module: ignite.handlers
    name: global_step_from_engine
